<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audio Studio | HRMantra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --hrm-blue: #003366; --accent: #5c67f2; }
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: 'Inter', sans-serif; min-height: 100vh; }
        
        .navbar { background: white; padding: 15px 50px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .main-card {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-radius: 25px; padding: 40px; margin: 40px auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-width: 1100px;
        }

        .studio-header { margin-bottom: 30px; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px; }
        .studio-title { font-weight: 800; color: #1a202c; font-size: 2rem; }

        /* Settings Bar */
        .settings-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .setting-item { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 15px; }
        .setting-label { font-size: 0.7rem; font-weight: 800; color: #718096; text-transform: uppercase; margin-bottom: 3px; }
        .form-select { border: none; font-weight: 600; color: var(--hrm-blue); cursor: pointer; padding: 0; height: auto; }
        .form-select:focus { box-shadow: none; }

        /* Editor Area */
        .editor-box { background: white; border: 2px solid #e2e8f0; border-radius: 20px; overflow: hidden; transition: 0.3s; }
        .editor-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(92, 103, 242, 0.1); }
        #textInput { width: 100%; border: none; padding: 30px; min-height: 300px; font-size: 1.1rem; line-height: 1.7; resize: none; outline: none; }

        /* Pause Toolbar */
        .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #f8fafc; border-top: 1px solid #e2e8f0; }
        .pause-btn { border: 1px solid #cbd5e1; background: white; border-radius: 8px; padding: 6px 16px; font-size: 0.85rem; font-weight: 700; color: #475569; transition: 0.2s; }
        .pause-btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-custom-pause { background: var(--accent); color: white; border: none; }
        .btn-custom-pause:hover { background: #4a54e1; color: white; }

        /* Action Buttons */
        .btn-generate { background: var(--hrm-blue); color: white; font-weight: 700; border-radius: 12px; padding: 15px 35px; border: none; transition: 0.2s; }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,51,102,0.3); }
    </style>
</head>
<body>

<nav class="navbar">
    <img src="https://hrmantra.com/assets/images/hrmantralogosvg.svg" height="40">
</nav>

<div class="main-card">
    <div class="studio-header">
        <h1 class="studio-title">AI Audio Studio</h1>
        <p class="text-muted">Generate professional neural voiceovers with custom pauses.</p>
    </div>

    <!-- Step-by-Step Settings -->
    <div class="settings-bar">
        <div class="setting-item">
            <p class="setting-label">1. Country</p>
            <select id="countrySelect" class="form-select" onchange="updateVoices()">
                <option value="">Select Country</option>
                {% for country in voice_map.keys()|sort %}
                <option value="{{ country }}">{{ country }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="setting-item">
            <p class="setting-label">2. Voice</p>
            <select id="voiceSelect" class="form-select" disabled>
                <option value="">Choose Country first</option>
            </select>
        </div>
        <div class="setting-item">
            <p class="setting-label">3. Speed</p>
            <select id="speedSelect" class="form-select">
                <option value="1.0">1.0x (Normal)</option>
                <option value="1.1">1.1x (Fast)</option>
                <option value="1.2">1.2x (Very Fast)</option>
                <option value="0.9">0.9x (Slow)</option>
            </select>
        </div>
        <div class="setting-item">
            <p class="setting-label">4. Format</p>
            <select id="formatSelect" class="form-select">
                <option value="mp3">MP3</option>
                <option value="wav">WAV</option>
            </select>
        </div>
    </div>

    <!-- Editor -->
    <div class="editor-box">
        <textarea id="textInput" placeholder="Enter your text script here... Click the pause buttons below to inject gaps at the cursor position."></textarea>
        <div class="toolbar">
            <div class="d-flex align-items-center gap-2">
                <span class="small fw-bold text-muted me-2">ADD PAUSE:</span>
                <button class="pause-btn" onclick="insertPause('0.5')">0.5s</button>
                <button class="pause-btn" onclick="insertPause('1.0')">1.0s</button>
                <button class="pause-btn" onclick="insertPause('2.0')">2.0s</button>
                <button class="pause-btn btn-custom-pause" onclick="insertCustomPause()">+ Custom</button>
            </div>
            <div class="stats text-muted small">
                <span id="charCount">0</span> / 10,000 characters
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
        <div id="loading" style="display:none;" class="text-primary fw-bold">
            <div class="spinner-border spinner-border-sm me-2"></div> Generating Audio...
        </div>
        <div id="playerArea" style="display:none;">
            <audio id="audioPlayer" controls></audio>
        </div>
        <button class="btn-generate ms-auto" id="genBtn" onclick="processAudio()">GENERATE & DOWNLOAD</button>
    </div>
</div>

<script>
    const voiceMap = {{ voice_map | tojson }};

    // Cascading Dropdown Logic
    function updateVoices() {
        const country = document.getElementById('countrySelect').value;
        const vSelect = document.getElementById('voiceSelect');
        vSelect.innerHTML = '';

        if (country && voiceMap[country]) {
            vSelect.disabled = false;
            voiceMap[country].forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = v.label;
                vSelect.appendChild(opt);
            });
        } else {
            vSelect.disabled = true;
            vSelect.innerHTML = '<option value="">Choose Country first</option>';
        }
    }

    // Cursor Injection Logic
    function insertPause(sec) {
        const textarea = document.getElementById('textInput');
        const tag = `<#${sec}#>`;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;

        textarea.value = text.substring(0, start) + tag + text.substring(end);
        textarea.focus();
        const newPos = start + tag.length;
        textarea.setSelectionRange(newPos, newPos);
        updateCharCount();
    }

    function insertCustomPause() {
        const val = prompt("Enter pause duration in seconds (e.g., 1.5 or 3):", "1.5");
        if (val && !isNaN(val)) {
            insertPause(val);
        }
    }

    function updateCharCount() {
        document.getElementById('charCount').innerText = document.getElementById('textInput').value.length;
    }

    document.getElementById('textInput').addEventListener('input', updateCharCount);

    async function processAudio() {
        const text = document.getElementById('textInput').value;
        const voice = document.getElementById('voiceSelect').value;
        const speed = document.getElementById('speedSelect').value;
        const btn = document.getElementById('genBtn');

        if(!text || !voice) return alert("Please select a voice and enter text.");

        btn.disabled = true;
        document.getElementById('loading').style.display = 'block';

        try {
            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text, voice, speed })
            });
            const data = await res.json();
            
            if(data.urls) {
                const player = document.getElementById('audioPlayer');
                player.src = data.urls.mp3;
                document.getElementById('playerArea').style.display = 'block';
                
                // Auto-download
                const link = document.createElement('a');
                link.href = data.urls.mp3;
                link.download = "HRMantra_AI_Voice.mp3";
                link.click();
            }
        } catch (e) {
            alert("Error generating audio.");
        } finally {
            btn.disabled = false;
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>
</body>
</html>
