<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audio Studio | HRMantra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --hrm-blue: #003366; --accent: #5c67f2; --bg: #f8fafc; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; }
        
        /* Corporate Header Selectors */
        .header-bar { background: white; padding: 10px 40px; border-bottom: 1px solid #e1e5eb; }
        .selectors-row { background: white; padding: 15px 40px; border-bottom: 1px solid #e1e5eb; display: flex; gap: 15px; justify-content: center; }
        
        .selector-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px 15px; background: white; min-width: 180px; }
        .selector-label { font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .form-select { border: none; font-weight: 700; color: var(--hrm-blue); padding: 0; font-size: 0.9rem; outline: none; }

        /* Dashboard Editor Card */
        .editor-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .studio-card { background: white; border-radius: 30px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; }
        
        #textInput { 
            width: 100%; border: 2px solid #e2e8f0; border-radius: 20px; 
            padding: 25px; min-height: 350px; font-size: 1.05rem; line-height: 1.8; 
            resize: none; outline: none; background: #fafbff; margin-bottom: 20px; transition: 0.3s;
        }
        #textInput:focus { border-color: var(--accent); background: white; }

        /* Action Buttons & Result Bar */
        .footer-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .btn-pause { border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 6px 18px; font-weight: 700; font-size: 0.85rem; margin-right: 10px; transition: 0.2s; }
        .btn-pause:hover { border-color: var(--accent); color: var(--accent); }
        
        .btn-action { font-weight: 700; border-radius: 12px; padding: 12px 25px; border: none; transition: 0.2s; }
        .btn-play { background: #f1f5f9; color: var(--hrm-blue); }
        .btn-download { background: var(--hrm-blue); color: white; }
        .btn-download:hover { background: #002244; transform: translateY(-1px); }

        /* The Output Result Panel */
        #resultPanel { 
            display: none; background: #eef2ff; padding: 10px 20px; border-radius: 15px; 
            align-items: center; gap: 15px; border: 1px solid #c7d2fe; margin-left: auto;
        }
        .btn-dl-now { background: var(--accent); color: white; border-radius: 8px; padding: 6px 14px; font-size: 0.8rem; text-decoration: none; font-weight: 700; }
        .btn-dl-now:hover { background: #4a54e1; color: white; }
    </style>
</head>
<body>

<div class="header-bar"><img src="https://hrmantra.com/assets/images/hrmantralogosvg.svg" height="35"></div>

<!-- STEP 1-4 SELECTORS IN HEADER -->
<div class="selectors-row">
    <div class="selector-box">
        <p class="selector-label">1. Country</p>
        <select id="countrySelect" class="form-select" onchange="updateVoices()">
            <option value="">Select Country</option>
            {% for country in voice_map.keys() %}
            <option value="{{ country }}">{{ country }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="selector-box">
        <p class="selector-label">2. Voice</p>
        <select id="voiceSelect" class="form-select" disabled><option>Choose Country first</option></select>
    </div>
    <div class="selector-box">
        <p class="selector-label">3. Speed</p>
        <select id="speedSelect" class="form-select">
            <option value="1.0">1.0x (Normal)</option>
            <option value="1.1">1.1x (Fast)</option>
            <option value="0.9">0.9x (Slow)</option>
        </select>
    </div>
    <div class="selector-box">
        <p class="selector-label">4. Format</p>
        <select class="form-select"><option>MP3</option><option>WAV</option></select>
    </div>
</div>

<div class="editor-container">
    <div class="studio-card">
        <h4 class="fw-bold mb-1">AI Audio Studio</h4>
        <p class="text-muted mb-4 small">Transform your words into natural neural speech.</p>

        <textarea id="textInput" placeholder="Enter text here...">If you think of a paragraph as a sandwich, <#0.5#>the supporting sentences are the filling between the bread.</textarea>

        <div class="footer-bar">
            <!-- Pause Buttons -->
            <div>
                <span class="small fw-bold text-muted me-2">Add pause</span>
                <button class="btn-pause" onclick="insertTag('0.5')">0.5s</button>
                <button class="btn-pause" onclick="insertTag('1.0')">1.0s</button>
                <button class="btn-pause" onclick="insertTag('2.0')">2.0s</button>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex align-items-center gap-2 ms-auto">
                <button class="btn-action btn-play" id="playBtn" onclick="generate(true)">▶ GENERATE & PLAY</button>
                <button class="btn-action btn-download" id="dlBtn" onclick="generate(false)">↓ GENERATE & DOWNLOAD</button>
                
                <!-- This panel shows after generation is complete -->
                <div id="resultPanel">
                    <audio id="audioPlayer" controls style="height: 35px;"></audio>
                    <a id="dlNowLink" class="btn-dl-now" href="#" download="audio.mp3">Download Now</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const voiceMap = {{ voice_map | tojson }};

    function updateVoices() {
        const country = document.getElementById('countrySelect').value;
        const vSelect = document.getElementById('voiceSelect');
        vSelect.innerHTML = '';
        if (country && voiceMap[country]) {
            vSelect.disabled = false;
            voiceMap[country].forEach(v => {
                let opt = document.createElement('option');
                opt.value = v.id; opt.textContent = v.label;
                vSelect.appendChild(opt);
            });
        }
    }

    // INSERT TAG AT CURSOR POSITION
    function insertTag(sec) {
        const textarea = document.getElementById('textInput');
        const tag = `<#${sec}#>`;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, start) + tag + textarea.value.substring(end);
        textarea.focus();
        textarea.setSelectionRange(start + tag.length, start + tag.length);
    }

    async function generate(isPlayOnly) {
        const text = document.getElementById('textInput').value;
        const voice = document.getElementById('voiceSelect').value;
        const speed = document.getElementById('speedSelect').value;

        if(!voice || voice.includes("Choose")) return alert("Please select a voice!");

        document.getElementById('playBtn').disabled = true;
        document.getElementById('dlBtn').disabled = true;

        try {
            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text, voice, speed })
            });
            const data = await res.json();
            
            if(data.url) {
                // Show Result Panel next to buttons
                document.getElementById('resultPanel').style.display = 'flex';
                const player = document.getElementById('audioPlayer');
                player.src = data.url;
                document.getElementById('dlNowLink').href = data.url;

                if(isPlayOnly) {
                    player.play();
                } else {
                    document.getElementById('dlNowLink').click();
                }
            } else {
                alert("Error: " + data.error);
            }
        } catch (e) {
            alert("Connection error. Ensure the server is running.");
        }
        
        document.getElementById('playBtn').disabled = false;
        document.getElementById('dlBtn').disabled = false;
    }
</script>
</body>
</html>
