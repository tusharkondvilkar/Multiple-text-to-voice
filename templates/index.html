<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audio Studio | HRMantra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --hrm-blue: #003366; --accent: #5c67f2; }
        body { background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; }
        
        .header-strip { background: white; padding: 10px 40px; border-bottom: 1px solid #e2e8f0; }
        .controls-row { background: white; padding: 15px 40px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 15px; justify-content: center; }
        
        .sel-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px 15px; background: white; min-width: 180px; }
        .sel-label { font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .form-select { border: none; font-weight: 700; color: var(--hrm-blue); padding: 0; font-size: 0.9rem; background-position: right center; }
        .form-select:focus { box-shadow: none; }

        .editor-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .glass-card { background: white; border-radius: 30px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        
        .textarea-frame { border: 2px solid #e2e8f0; border-radius: 20px; transition: 0.3s; margin-bottom: 20px; }
        .textarea-frame:focus-within { border-color: var(--accent); }
        #textInput { width: 100%; border: none; padding: 30px; min-height: 350px; font-size: 1.1rem; line-height: 1.8; resize: none; outline: none; border-radius: 20px; background: #fafbff; }

        .btn-pause { border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 6px 18px; font-weight: 700; font-size: 0.85rem; margin-right: 10px; }
        .btn-main { font-weight: 700; border-radius: 12px; padding: 12px 30px; border: none; transition: 0.2s; }
        .btn-play { background: #f1f5f9; color: var(--hrm-blue); margin-right: 15px; }
        .btn-download { background: var(--hrm-blue); color: white; }
    </style>
</head>
<body>

<div class="header-strip"><img src="https://hrmantra.com/assets/images/hrmantralogosvg.svg" height="35"></div>

<div class="controls-row">
    <div class="sel-box">
        <p class="sel-label">1. Country</p>
        <select id="countrySelect" class="form-select" onchange="updateVoices()">
            <option value="">Select Country</option>
            {% for country in voice_map.keys() %}
            <option value="{{ country }}">{{ country }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="sel-box">
        <p class="sel-label">2. Voice</p>
        <select id="voiceSelect" class="form-select" disabled><option>Choose Country first</option></select>
    </div>
    <div class="sel-box">
        <p class="sel-label">3. Speed</p>
        <select id="speedSelect" class="form-select">
            <option value="1.0">1.0x (Normal)</option>
            <option value="1.1">1.1x (Fast)</option>
            <option value="0.9">0.9x (Slow)</option>
        </select>
    </div>
    <div class="sel-box">
        <p class="sel-label">4. Format</p>
        <select class="form-select"><option>MP3</option><option>WAV</option></select>
    </div>
</div>

<div class="editor-container">
    <div class="glass-card">
        <p class="small fw-bold text-primary mb-1">TEXT TO SPEECH</p>
        <h2 class="fw-800 mb-4">AI Audio Studio</h2>

        <div class="textarea-frame">
            <textarea id="textInput">If you think of a paragraph as a sandwich, <#0.5#>the supporting sentences are the filling between the bread. They make up the body of the paragraph by explaining, proving, or enhancing the controlling idea in the topic sentence. <#0.5#>The overall method of development for paragraphs depends upon the essay <#0.5#>as a whole and the purpose of each paragraph; thus paragraphs may be developed by using examples, description, narration, comparison and contrast, definition, cause and effect, classification and division. <#0.5#>A writer may use one method, or combine several methods.</textarea>
        </div>

        <div class="d-flex justify-content-between align-items-center">
            <div>
                <span class="small fw-bold text-muted me-3">Add pause</span>
                <button class="btn-pause" onclick="addTag('0.5')">0.5s</button>
                <button class="btn-pause" onclick="addTag('1.0')">1.0s</button>
                <button class="btn-pause" onclick="addTag('2.0')">2.0s</button>
            </div>
            <div>
                <button class="btn-main btn-play" onclick="generate(true)">▶ GENERATE & PLAY</button>
                <button class="btn-main btn-download" id="genBtn" onclick="generate(false)">↓ GENERATE & DOWNLOAD</button>
            </div>
        </div>
    </div>
</div>

<script>
    const voiceMap = {{ voice_map | tojson }};

    function updateVoices() {
        const country = document.getElementById('countrySelect').value;
        const vSelect = document.getElementById('voiceSelect');
        vSelect.innerHTML = '';
        if (country && voiceMap[country]) {
            vSelect.disabled = false;
            voiceMap[country].forEach(v => {
                let opt = document.createElement('option');
                opt.value = v.id; opt.textContent = v.label;
                vSelect.appendChild(opt);
            });
        } else {
            vSelect.disabled = true;
            vSelect.innerHTML = '<option>Choose Country first</option>';
        }
    }

    function addTag(sec) {
        const area = document.getElementById('textInput');
        const tag = `<#${sec}#>`;
        const start = area.selectionStart;
        area.value = area.value.substring(0, start) + tag + area.value.substring(area.selectionEnd);
        area.focus();
        area.setSelectionRange(start + tag.length, start + tag.length);
    }

    async function generate(isPlay) {
        const text = document.getElementById('textInput').value;
        const voice = document.getElementById('voiceSelect').value;
        const speed = document.getElementById('speedSelect').value;
        if(!voice || voice.includes("Choose")) return alert("Select a voice!");

        document.getElementById('genBtn').disabled = true;
        try {
            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text, voice, speed })
            });
            const data = await res.json();
            if(data.url) {
                if(isPlay) { new Audio(data.url).play(); }
                else { 
                    const a = document.createElement('a');
                    a.href = data.url; a.download = "HRMantra_AI.mp3";
                    a.click();
                }
            } else { alert("Error: " + data.error); }
        } catch (e) { alert("Connection error. Server may be busy."); }
        document.getElementById('genBtn').disabled = false;
    }
</script>
</body>
</html>
