<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audio Studio | HRMantra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --hrm-blue: #003366; --accent: #5c67f2; }
        body { background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; }
        
        .header-strip { background: white; padding: 12px 40px; border-bottom: 1px solid #e2e8f0; }
        .controls-row { background: white; padding: 15px 40px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        
        .sel-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px 15px; background: white; min-width: 200px; }
        .sel-label { font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .form-select { border: none; font-weight: 700; color: var(--hrm-blue); padding: 0; font-size: 0.95rem; }
        .form-select:focus { box-shadow: none; }

        .editor-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .glass-card { background: white; border-radius: 25px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        
        .textarea-frame { border: 2px solid #667eea; border-radius: 20px; transition: 0.3s; margin-bottom: 20px; background: #fafbff; }
        #textInput { width: 100%; border: none; padding: 30px; min-height: 320px; font-size: 1.1rem; line-height: 1.8; resize: none; outline: none; border-radius: 20px; background: transparent; }

        .btn-pause { border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; padding: 8px 20px; font-weight: 700; font-size: 0.85rem; margin-right: 8px; transition: 0.2s; }
        .btn-pause:hover { border-color: var(--accent); color: var(--accent); }
        
        .btn-main { font-weight: 700; border-radius: 12px; padding: 12px 30px; border: none; transition: 0.2s; }
        .btn-play { background: #f1f5f9; color: var(--hrm-blue); margin-right: 12px; }
        .btn-download { background: var(--accent); color: white; }
        .btn-download:hover { background: #4a54e1; }
        
        .stats-text { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
    </style>
</head>
<body>

<div class="header-strip">
    <img src="https://hrmantra.com/assets/images/hrmantralogosvg.svg" height="38">
</div>

<!-- Header Selectors -->
<div class="controls-row">
    <div class="sel-box">
        <p class="sel-label">1. Country</p>
        <select id="countrySelect" class="form-select" onchange="updateVoices()">
            <option value="">Select Country</option>
            {% for country in voice_map.keys() %}
            <option value="{{ country }}">{{ country }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="sel-box">
        <p class="sel-label">2. Voice</p>
        <select id="voiceSelect" class="form-select" disabled>
            <option value="">Choose Country first</option>
        </select>
    </div>
    <div class="sel-box" style="min-width: 150px;">
        <p class="sel-label">3. Speed</p>
        <select id="speedSelect" class="form-select">
            <option value="1.0">1.0x (Normal)</option>
            <option value="1.1">1.1x (Fast)</option>
            <option value="1.2">1.2x (Very Fast)</option>
            <option value="0.9">0.9x (Slow)</option>
            <option value="0.8">0.8x (Very Slow)</option>
        </select>
    </div>
    <div class="sel-box" style="min-width: 120px;">
        <p class="sel-label">4. Format</p>
        <select class="form-select"><option>MP3</option></select>
    </div>
</div>

<div class="editor-container">
    <div class="glass-card">
        <p class="small fw-bold mb-1" style="color: var(--accent);">TEXT TO SPEECH</p>
        <h2 class="fw-bold mb-1">AI Audio Studio</h2>
        <p class="text-muted mb-4">Transform your words into natural neural speech.</p>

        <div class="textarea-frame">
            <textarea id="textInput">If you think of a paragraph as a sandwich, <#0.5#>the supporting sentences are the filling between the bread. They make up the body of the paragraph by explaining, proving, or enhancing the controlling idea in the topic sentence. <#0.5#>The overall method of development for paragraphs depends upon the essay <#0.5#>as a whole and the purpose of each paragraph; thus paragraphs may be developed by using examples, description, narration, comparison and contrast, definition, cause and effect, classification and division. <#0.5#>A writer may use one method, or combine several methods.</textarea>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center">
                <span class="small fw-bold text-muted me-3">Add pause</span>
                <button class="btn-pause" onclick="addTag('0.5')">0.5s</button>
                <button class="btn-pause" onclick="addTag('1.0')">1.0s</button>
                <button class="btn-pause" onclick="addTag('2.0')">2.0s</button>
                <button class="btn-pause" onclick="addCustomTag()">+ Custom</button>
            </div>

            <div class="stats-text">
                <span id="charCount">0</span> / 10,000 characters
            </div>

            <div>
                <button class="btn-main btn-play" onclick="generateAudio(true)">▶ GENERATE & PLAY</button>
                <button class="btn-main btn-download" id="genBtn" onclick="generateAudio(false)">↓ GENERATE & DOWNLOAD</button>
            </div>
        </div>
    </div>
</div>

<script>
    const voiceMap = {{ voice_map | tojson }};

    function updateVoices() {
        const country = document.getElementById('countrySelect').value;
        const vSelect = document.getElementById('voiceSelect');
        vSelect.innerHTML = '';
        if (country && voiceMap[country]) {
            vSelect.disabled = false;
            voiceMap[country].forEach(v => {
                let opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = v.label;
                vSelect.appendChild(opt);
            });
        } else {
            vSelect.disabled = true;
            vSelect.innerHTML = '<option value="">Choose Country first</option>';
        }
    }

    function addTag(sec) {
        const area = document.getElementById('textInput');
        const tag = `<#${sec}#>`;
        const start = area.selectionStart;
        const end = area.selectionEnd;
        area.value = area.value.substring(0, start) + tag + area.value.substring(end);
        area.focus();
        area.setSelectionRange(start + tag.length, start + tag.length);
        updateChars();
    }

    function addCustomTag() {
        const val = prompt("Enter pause in seconds (e.g. 1.5, 3.0):", "1.5");
        if (val && !isNaN(val)) {
            addTag(val);
        }
    }

    function updateChars() {
        document.getElementById('charCount').innerText = document.getElementById('textInput').value.length;
    }
    document.getElementById('textInput').addEventListener('input', updateChars);
    updateChars();

    async function generateAudio(isPlay) {
        const text = document.getElementById('textInput').value.trim();
        const voice = document.getElementById('voiceSelect').value;
        const speed = document.getElementById('speedSelect').value;

        if (!countrySelect.value || !voice || voice.includes("Choose")) {
            return alert("Please select a Country and Voice from the header!");
        }
        if (!text) return alert("Please enter text in the editor.");

        const btn = document.getElementById('genBtn');
        btn.disabled = true;
        btn.innerText = "Processing...";

        try {
            const res = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, voice, speed })
            });
            const data = await res.json();
            
            if (data.url) {
                if (isPlay) {
                    const audio = new Audio(data.url);
                    audio.play();
                } else {
                    const a = document.createElement('a');
                    a.href = data.url;
                    a.download = "HRMantra_Speech.mp3";
                    a.click();
                }
            } else {
                alert("Generation Error: " + (data.error || "Unknown"));
            }
        } catch (e) {
            alert("Server connection failed. Please try again.");
        } finally {
            btn.disabled = false;
            btn.innerText = "↓ GENERATE & DOWNLOAD";
        }
    }
</script>
</body>
</html>
