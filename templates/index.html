<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMantra AI Voice Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #003366; --accent: #00aaff; --bg: #f0f2f5; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }
        .main-container { height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: white; border-bottom: 2px solid #e1e4e8; padding: 10px 30px; }
        .logo { height: 40px; }
        
        .workspace { flex: 1; display: flex; padding: 20px; gap: 20px; overflow: hidden; }
        .editor-side { flex: 2; background: white; border-radius: 15px; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .config-side { flex: 1; background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow-y: auto; }
        
        #textInput { flex: 1; border: 1px solid #ddd; border-radius: 10px; padding: 15px; font-size: 1.1rem; resize: none; margin-bottom: 15px; }
        #textInput:focus { outline: none; border-color: var(--accent); }

        .timeline { margin: 20px 0; display: none; }
        .step-pill { padding: 5px 15px; border-radius: 20px; background: #eee; font-size: 0.8rem; transition: 0.3s; }
        .step-active { background: var(--primary); color: white; }

        .form-label { font-weight: 700; color: var(--primary); margin-top: 15px; display: block; }
        .btn-generate { background: var(--primary); color: white; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; border: none; margin-top: 20px; }
        .btn-generate:hover { background: #002244; }

        .download-box { margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; display: none; }
        .format-badge { cursor: pointer; border: 1px solid var(--primary); padding: 5px 10px; border-radius: 5px; margin-right: 5px; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<nav class="navbar d-flex justify-content-between align-items-center">
    <img src="https://hrmantra.com/assets/images/hrmantralogosvg.svg" alt="HRMantra" class="logo">
    <span class="fw-bold text-muted">AI Voice Generation Console</span>
</nav>

<div class="main-container">
    <div class="workspace">
        <!-- Editor Side -->
        <div class="editor-side">
            <label class="form-label">Script Console</label>
            <textarea id="textInput" placeholder="Enter your text here... Tip: Press Enter to create segments for the delay feature."></textarea>
            
            <div id="timeline" class="timeline">
                <div class="progress mb-3" style="height: 10px;">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="step-pill" id="s1">Connecting</span>
                    <span class="step-pill" id="s2">Synthesizing</span>
                    <span class="step-pill" id="s3">Converting</span>
                    <span class="step-pill" id="s4">Done</span>
                </div>
            </div>
        </div>

        <!-- Configuration Side -->
        <div class="config-side">
            <label class="form-label">1. Choose Country</label>
            <select id="countrySelect" class="form-select form-select-lg" onchange="updateVoices()">
                <option value="">Select Country</option>
                {% for country in voice_map.keys()|sort %}
                <option value="{{ country }}">{{ country }}</option>
                {% endfor %}
            </select>

            <label class="form-label">2. Select Voice</label>
            <select id="voiceSelect" class="form-select" disabled>
                <option value="">Choose Country first...</option>
            </select>

            <label class="form-label">3. Custom Time Gap (Seconds)</label>
            <div class="input-group">
                <input type="number" id="delayInput" class="form-control" value="0.5" step="0.1" min="0">
                <span class="input-group-text">sec</span>
            </div>
            <small class="text-muted">Adds a pause between paragraphs.</small>

            <label class="form-label">4. Export Formats</label>
            <div class="d-flex gap-2 mt-2">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="mp3" checked disabled>
                    <label class="form-check-label">MP3</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="wavCheck" value="wav">
                    <label class="form-check-label">WAV</label>
                </div>
            </div>

            <button class="btn-generate" id="genBtn" onclick="processAudio()">GENERATE AUDIO</button>

            <div id="downloadBox" class="download-box">
                <h6 class="mb-3">Downloads:</h6>
                <div id="downloadLinks"></div>
                <audio id="player" controls class="w-100 mt-3"></audio>
            </div>
        </div>
    </div>
</div>

<script>
const voiceMap = {{ voice_map | tojson }};

function updateVoices() {
    const country = document.getElementById('countrySelect').value;
    const vSelect = document.getElementById('voiceSelect');
    vSelect.innerHTML = '<option value="">Choose a voice...</option>';
    
    if (country && voiceMap[country]) {
        vSelect.disabled = false;
        voiceMap[country].forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.id;
            opt.textContent = v.label;
            vSelect.appendChild(opt);
        });
    } else {
        vSelect.disabled = true;
    }
}

async function processAudio() {
    const text = document.getElementById('textInput').value;
    const voice = document.getElementById('voiceSelect').value;
    const delay = document.getElementById('delayInput').value;
    const formats = ['mp3'];
    if(document.getElementById('wavCheck').checked) formats.push('wav');

    if(!text || !voice) return alert("Select Voice and Enter Text");

    // UI Reset
    document.getElementById('timeline').style.display = 'block';
    document.getElementById('downloadBox').style.display = 'none';
    document.getElementById('genBtn').disabled = true;
    
    // Animate Timeline
    updateStep(1, 25);
    
    try {
        const res = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ text, voice, delay, formats })
        });
        const data = await res.json();
        
        updateStep(2, 60);
        setTimeout(() => updateStep(3, 85), 500);
        
        if(data.urls) {
            setTimeout(() => {
                updateStep(4, 100);
                showDownloads(data.urls);
                document.getElementById('genBtn').disabled = false;
            }, 1000);
        }
    } catch(e) {
        alert("Error processing request.");
        document.getElementById('genBtn').disabled = false;
    }
}

function updateStep(stepNum, percent) {
    document.getElementById('progressBar').style.width = percent + '%';
    for(let i=1; i<=4; i++) {
        document.getElementById('s'+i).classList.remove('step-active');
    }
    document.getElementById('s'+stepNum).classList.add('step-active');
}

function showDownloads(urls) {
    const container = document.getElementById('downloadLinks');
    container.innerHTML = '';
    document.getElementById('downloadBox').style.display = 'block';
    document.getElementById('player').src = urls.mp3;

    for (const [format, url] of Object.entries(urls)) {
        const a = document.createElement('a');
        a.href = url;
        a.className = 'format-badge';
        a.download = `voice_output.${format}`;
        a.textContent = `Download .${format.toUpperCase()}`;
        container.appendChild(a);
    }
}
</script>
</body>
</html>
