<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Audio Studio | HRMantra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --hrm-blue: #003366; --accent: #5c67f2; }
        body { background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; }
        .top-nav { background: white; padding: 10px 40px; border-bottom: 1px solid #e1e5eb; }
        .controls-header { background: white; padding: 20px 40px; border-bottom: 1px solid #e1e5eb; display: flex; gap: 15px; justify-content: center; }
        
        .selector-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 8px 15px; background: white; min-width: 150px; }
        .selector-label { font-size: 0.65rem; font-weight: 800; color: #718096; text-transform: uppercase; margin-bottom: 2px; }
        .form-select { border: none; font-weight: 700; color: var(--hrm-blue); padding: 0; font-size: 0.9rem; }
        .form-select:focus { box-shadow: none; }

        .editor-card { background: white; border-radius: 25px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 1100px; margin: 40px auto; }
        .text-area-wrapper { border: 2px solid #e2e8f0; border-radius: 20px; margin-bottom: 20px; transition: 0.3s; }
        .text-area-wrapper:focus-within { border-color: var(--accent); }
        #textInput { width: 100%; border: none; padding: 25px; min-height: 300px; font-size: 1.05rem; line-height: 1.7; resize: none; outline: none; border-radius: 20px; }

        .btn-action { font-weight: 700; border-radius: 12px; padding: 12px 25px; border: none; }
        .btn-play { background: #f1f5f9; color: var(--hrm-blue); margin-right: 10px; }
        .btn-download { background: var(--hrm-blue); color: white; }
        .pause-btn { border: 1px solid #e2e8f0; background: #fff; border-radius: 8px; padding: 6px 15px; font-weight: 700; font-size: 0.85rem; margin-right: 8px; }
        .player-section { display: none; margin-top: 28px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 16px; background: #f8fafc; }
        .player-section.show { display: block; }
        .player-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .player-btn { border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; }
        .player-play { background: var(--hrm-blue); color: white; }
        .player-stop { background: #e2e8f0; color: #1e293b; }
        .player-download { background: #fff; color: var(--hrm-blue); border: 1px solid var(--hrm-blue); }
        #audioPlayer { width: 100%; margin-bottom: 16px; }
        @media (max-width: 768px) {
            .controls-header { flex-wrap: wrap; padding: 16px; }
            .editor-card { margin: 20px 12px; padding: 24px; }
            .editor-actions { align-items: flex-start !important; flex-direction: column; gap: 18px; }
        }
    </style>
</head>
<body>

<div class="top-nav"><img src="https://hrmantra.com/assets/images/hrmantralogosvg.svg" height="35"></div>

<div class="controls-header">
    <div class="selector-box">
        <p class="selector-label">1. Country</p>
        <select id="countrySelect" class="form-select" onchange="updateVoices()">
            <option value="">Select Country</option>
            {% for country in voice_map.keys()|sort %}
            <option value="{{ country }}">{{ country }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="selector-box">
        <p class="selector-label">2. Voice</p>
        <select id="voiceSelect" class="form-select" disabled><option>Choose Country first</option></select>
    </div>
    <div class="selector-box">
        <p class="selector-label">3. Speed</p>
        <select id="speedSelect" class="form-select">
            <option value="1.0">1.0x (Normal)</option>
            <option value="1.1">1.1x (Fast)</option>
            <option value="0.9">0.9x (Slow)</option>
        </select>
    </div>
    <div class="selector-box">
        <p class="selector-label">4. Format</p>
        <select id="formatSelect" class="form-select"><option value="mp3">MP3</option><option value="wav">WAV</option></select>
    </div>
</div>

<div class="editor-card">
    <h4 class="fw-bold mb-1">AI Audio Studio</h4>
    <p class="text-muted mb-4">Transform your words into natural neural speech.</p>

    <div class="text-area-wrapper">
        <textarea id="textInput" placeholder="Enter text...">If you think of a paragraph as a sandwich, <#0.5#>the supporting sentences are the filling between the bread.</textarea>
    </div>

    <div class="d-flex justify-content-between align-items-center editor-actions">
        <div>
            <span class="small fw-bold text-muted me-2">Add pause</span>
            <button class="pause-btn" onclick="insertTag('0.5')">0.5s</button>
            <button class="pause-btn" onclick="insertTag('1.0')">1.0s</button>
            <button class="pause-btn" onclick="insertTag('2.0')">2.0s</button>
            <button class="pause-btn" onclick="insertTag('2.5')">2.5s</button>
            <button class="pause-btn" onclick="insertTag('3.0')">3.0s</button>
            <button class="pause-btn" onclick="insertTag('5.0')">5.0s</button>
            <button class="pause-btn" onclick="insertTag('15.0')">15.0s</button>
            
        </div>
        <div>
            <button class="btn-action btn-play" id="playBtn" onclick="generate(true)">▶ GENERATE & PLAY</button>
            <button class="btn-action btn-download" id="genBtn" onclick="generate(false)">↓ GENERATE & DOWNLOAD</button>
        </div>
    </div>

    <div class="player-section" id="playerSection">
        <h6 class="fw-bold mb-3">Generated Audio Player</h6>
        <audio id="audioPlayer" controls preload="metadata"></audio>
        <div class="player-controls">
            <button class="player-btn player-play" type="button" onclick="playGeneratedAudio()">▶ PLAY</button>
            <button class="player-btn player-stop" type="button" onclick="stopGeneratedAudio()">■ STOP</button>
            <button class="player-btn player-download" type="button" onclick="downloadGeneratedAudio()">↓ DOWNLOAD</button>
        </div>
    </div>
</div>

<script>
    const voiceMap = {{ voice_map | tojson }};
    let generatedAudioUrl = '';
    let generatedAudioFilename = 'HRMantra_Audio.mp3';

    function updateVoices() {
        const country = document.getElementById('countrySelect').value;
        const vSelect = document.getElementById('voiceSelect');
        vSelect.innerHTML = '';
        if (country && voiceMap[country]) {
            vSelect.disabled = false;
            voiceMap[country].forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = v.label;
                vSelect.appendChild(opt);
            });
        } else {
            vSelect.disabled = true;
            vSelect.innerHTML = '<option>Choose Country first</option>';
        }
    }

    function insertTag(sec) {
        const textarea = document.getElementById('textInput');
        const tag = `<#${sec}#>`;
        const start = textarea.selectionStart;
        textarea.value = textarea.value.substring(0, start) + tag + textarea.value.substring(textarea.selectionEnd);
        textarea.focus();
        textarea.setSelectionRange(start + tag.length, start + tag.length);
    }

    function showGeneratedPlayer(url, filename) {
        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        generatedAudioUrl = url;
        generatedAudioFilename = filename;
        audioPlayer.src = url;
        audioPlayer.load();
        document.getElementById('playerSection').classList.add('show');
    }

    async function playGeneratedAudio() {
        if (!generatedAudioUrl) return alert('Please generate audio first.');
        await document.getElementById('audioPlayer').play();
    }

    function stopGeneratedAudio() {
        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
    }

    function downloadGeneratedAudio() {
        if (!generatedAudioUrl) return alert('Please generate audio first.');
        const link = document.createElement('a');
        link.href = generatedAudioUrl;
        link.download = generatedAudioFilename;
        document.body.appendChild(link);
        link.click();
        link.remove();
    }

    async function generate(isPlayOnly) {
        const text = document.getElementById('textInput').value;
        const voice = document.getElementById('voiceSelect').value;
        const speed = document.getElementById('speedSelect').value;
        const format = document.getElementById('formatSelect').value;
        const genBtn = document.getElementById('genBtn');
        const playBtn = document.getElementById('playBtn');

        if(!voice || voice.includes("Choose")) return alert("Please select a voice!");
        if(!text.trim()) return alert("Please enter text to generate audio.");

        genBtn.disabled = true;
        playBtn.disabled = true;
        try {
            const res = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text, voice, speed, format })
            });
            const contentType = res.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) {
                throw new Error(`Server returned ${res.status}. Please check the Render logs.`);
            }
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || `Server returned ${res.status}.`);
            
            if(data.url) {
                showGeneratedPlayer(data.url, data.filename || `HRMantra_Audio.${format}`);
                if(isPlayOnly) {
                    await playGeneratedAudio();
                } else {
                    downloadGeneratedAudio();
                }
            } else {
                throw new Error(data.error || "Unknown server error.");
            }
        } catch (e) {
            alert(e.message || "Connection error. Please try again.");
        } finally {
            genBtn.disabled = false;
            playBtn.disabled = false;
        }
    }
</script>
</body>
</html>
